<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monde test — Le contrôle</title><style>
*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#202628;color:#f6f5ef;font-family:system-ui,sans-serif}canvas{display:block;width:100vw;height:100vh}header{position:fixed;left:20px;right:20px;top:18px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;pointer-events:none}header div{background:#182023d9;padding:12px 16px;border:1px solid #ffffff24;border-radius:8px;backdrop-filter:blur(12px)}h1{font-size:18px;margin:0 0 3px;font-weight:600}header small{color:#c7cacc;font-size:14px}a,button{font:500 14px system-ui;color:#faf9f3;pointer-events:auto;border:1px solid #ffffff45;background:#20282deb;border-radius:7px;padding:11px 16px;text-decoration:none;cursor:pointer}a:hover,button:hover{background:#414b50}footer{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#182023df;border:1px solid #ffffff25;border-radius:8px;padding:11px 18px;font-size:14px;text-align:center;max-width:94vw;white-space:nowrap}#prompt{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);padding:9px 14px;background:#19252bd9;border-radius:7px;font-size:15px;display:none}#crosshair{position:fixed;left:50%;top:50%;width:4px;height:4px;background:#fff9;border-radius:50%;pointer-events:none}#error{display:none;position:fixed;inset:30%;background:#21292e;padding:20px;border-radius:12px;font-size:17px}#look{position:fixed;right:20px;bottom:85px}#touch{display:none;position:fixed;left:18px;bottom:85px;width:150px;grid-template-columns:repeat(3,1fr);gap:4px}#touch button{padding:12px;font-size:18px}#touch button:first-child{grid-column:2}#touch button:nth-child(2){grid-column:1}@media(pointer:coarse){#touch{display:grid}footer{white-space:normal;width:94vw;font-size:12px}header{left:10px;right:10px}header div{padding:9px}#look{right:12px}}
</style></head><body><header><div><h1>Monde test</h1><small>CDI · exploration libre</small></div><a href="index.html">Retour à l’accueil</a></header><div id="crosshair"></div><div id="prompt"></div><button id="look">Explorer</button><div id="touch"><button data-key="z">↑</button><button data-key="q">←</button><button data-key="s">↓</button><button data-key="d">→</button></div><footer>ZQSD : marcher · souris : regarder · E : porte · Échap : libérer la souris</footer><div id="error"></div><script>addEventListener('error',e=>{const el=document.getElementById('error');el.style.display='block';el.textContent='La scène n’a pas pu démarrer : '+e.message});</script><script src="three.min.js?v=27"></script><script src="monde-test.js?v=27"></script></body></html>
